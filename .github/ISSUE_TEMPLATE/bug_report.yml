name: Bug report
description: Report a problem with the Rustatio Home Assistant App
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Rustatio App version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant App logs
      description: Remove tokens, tracker credentials and other secrets.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed secrets from the logs.
          required: true
        - label: I checked the App documentation and troubleshooting section.
          required: true
