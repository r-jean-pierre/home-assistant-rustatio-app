worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 8099;
        server_name _;

        allow 172.30.32.2;
        deny all;

        client_max_body_size 128m;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/css application/javascript text/javascript application/manifest+json;

            sub_filter '/assets/' '$http_x_ingress_path/assets/';
            sub_filter '"/favicon' '"$http_x_ingress_path/favicon';
            sub_filter '"/apple-touch-icon' '"$http_x_ingress_path/apple-touch-icon';
            sub_filter '"/site.webmanifest' '"$http_x_ingress_path/site.webmanifest';
            sub_filter '"/android-chrome-' '"$http_x_ingress_path/android-chrome-';

            sub_filter '<head>' '<head><script>(function(){var m=location.pathname.match(/^\\/api\\/hassio_ingress\\/[^/]+/);if(!m)return;var p=m[0],f=window.fetch.bind(window);window.fetch=function(i,o){if(typeof i==="string"&&i.indexOf("/api/")===0)i=p+i;return f(i,o)};var E=window.EventSource;window.EventSource=class extends E{constructor(u,c){if(typeof u==="string"&&u.indexOf("/api/")===0)u=p+u;super(u,c)}};})();</script>';
        }
    }
}
